[project]
name = "fundlens"
version = "0.1.0"
description = "Free public campaign-finance platform: federal races, resolved donors, open dataset"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.122",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "opentelemetry-distro>=0.66b2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-botocore>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "psycopg[binary,pool]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.2",
    "sentry-sdk[fastapi]>=2.73.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs-lite[s3]>=1.43.122",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.scripts]
fundlens = "fundlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundlens"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
# ruff 0.16.0 began formatting Python code blocks inside Markdown by default.
# Keep `ruff format` scoped to real source so hand-authored docs aren't rewritten.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
