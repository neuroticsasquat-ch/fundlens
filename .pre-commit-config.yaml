minimum_pre_commit_version: "3.5.0"

# Every hook calls a Taskfile target, and the target runs inside a dev container via
# `docker compose exec app` or, for frontend/, `docker compose exec frontend`
# (tbc-localdev-infra/CONVENTIONS.md). The Taskfile is the only place
# the toolchain is invoked, so the hooks and `task <x>` can't drift apart. The containers must
# be up (`task up` and `task fe:dev`) and rebuilt after a dependency change (`task build`).
#
# The hooks run what CI runs (.github/workflows/ci.yml), so a commit that passes them passes CI:
# a CI failure costs far more than a slower commit. That means the whole pytest suite, its
# integration tests included, against the dev stack's Postgres and MinIO (about 35 seconds on 8
# xdist workers, NEU-2268), whenever anything it reads changes: Python, SQL, fixtures,
# migrations, resolution data. A commit touching only sql/ runs it too. Each hook fires only on the paths its CI job depends
# on, so a docs-only commit runs none.
repos:
  - repo: local
    hooks:
      - id: lint
        name: lint (container)
        entry: task lint
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$

      - id: format
        name: format --check (container)
        entry: task format:check
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$

      - id: typecheck
        name: typecheck (container)
        entry: task typecheck
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$

      # The whole suite, as CI's python job runs it, on every commit but one touching only files
      # no test reads: an exclude list, not an include list, so a new kind of input runs the
      # suite by default. The tests read sql/, src/'s vendored CSVs, resolution/, openapi.json,
      # docker-compose.yml and docs/runbooks/ (test_resolve reads adding-an-override.md), not
      # frontend/, .github/ (CI's own environment, which no local hook can run) or other docs.
      # `verbose` prints pytest's slowest tests (--durations, pyproject.toml) on every commit.
      - id: test
        name: test (container)
        entry: task test
        language: system
        pass_filenames: false
        verbose: true
        exclude: ^(frontend/|\.github/|\.claude/|docs/(?!runbooks/)|[^/]+\.md$|LICENSE$|\.gitignore$)

      # CI's Alembic head and drift checks (spec §7.3).
      - id: db-check
        name: db:migrate + db:check (container)
        entry: task db:migrate db:check
        language: system
        pass_filenames: false
        files: ^migrations/|^src/fundlens/app_schema\.py$|^alembic\.ini$|^pyproject\.toml$|^uv\.lock$

      # CI's openapi-drift: the committed contract and client match what the API generates.
      # Not limited to frontend/: a backend change is the one that can leave them stale.
      - id: openapi-drift
        name: fe:generate:check (containers)
        entry: task fe:generate:check
        language: system
        pass_filenames: false
        files: ^src/fundlens/|^openapi\.json$|^frontend/src/api/|^frontend/scripts/generate-api\.sh$|^frontend/package\.json$|^frontend/pnpm-lock\.yaml$|^pyproject\.toml$|^uv\.lock$

      - id: prod-check
        name: prod:check
        entry: task prod:check
        language: system
        pass_filenames: false
        files: ^docker-compose\.prod\.yml$

      # CI's image job: the prod image builds, runs as non-root and passes .github/ci/smoke.sh.
      - id: image-check
        name: image:check (host Docker)
        entry: task image:check
        language: system
        pass_filenames: false
        files: ^Dockerfile$|^\.dockerignore$|^pyproject\.toml$|^uv\.lock$|^\.github/ci/smoke\.sh$

      - id: fe-lint
        name: fe:lint (container)
        entry: task fe:lint
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: fe-typecheck
        name: fe:typecheck (container)
        entry: task fe:typecheck
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: fe-test
        name: fe:test (container)
        entry: task fe:test
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: fe-build
        name: fe:build (container)
        entry: task fe:build
        language: system
        pass_filenames: false
        files: ^frontend/
