minimum_pre_commit_version: "3.5.0"

# Every hook calls a Taskfile target, and the target runs inside the dev container via
# `docker compose exec app` (tbc-localdev-infra/CONVENTIONS.md). The Taskfile is the only place
# the toolchain is invoked, so the hooks and `task <x>` can't drift apart. The container must
# be up (`task up`) and rebuilt after a dependency change (`task build`).
#
# Exception: the test hook runs `task test:unit` rather than `task test` (spec §11 names
# pytest-unit as the hook): the integration and end-to-end suites grow to need a loaded
# Postgres and MinIO, and CI runs them on every PR.
repos:
  - repo: local
    hooks:
      - id: lint
        name: lint (container)
        entry: task lint
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$

      - id: format
        name: format --check (container)
        entry: task format:check
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$

      - id: typecheck
        name: typecheck (container)
        entry: task typecheck
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$

      - id: test
        name: test:unit (container)
        entry: task test:unit
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$
