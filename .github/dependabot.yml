# Everything lands on the long-lived updates/dependencies branch, not main. dependencies.yml keeps
# that branch synced with main and auto-merges these PRs into it when `ci` is green; a person
# promotes it to main (auto-promote is off in this repo).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The npm ecosystem reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: ci
    # The shared workflows float on @v1; bumping them is the workflows repo's job.
    ignore:
      - dependency-name: neuroticsasquat-ch/workflows
    groups:
      minor-and-patch:
        update-types: [minor, patch]
