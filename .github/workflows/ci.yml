name: ci

on:
  # Every PR whatever its base, so Dependabot's PRs into updates/dependencies are tested too.
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A job-level path filter rather than workflow-level `paths:`, so a filtered-out `js` reports
  # as skipped, which `ci` passes.
  changes:
    runs-on: ubuntu-latest
    # paths-filter lists a PR's files through the API; on a push it diffs with git.
    permissions: { contents: read, pull-requests: read }
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            frontend:
              - "frontend/**"
              - ".github/workflows/ci.yml"

  # uv sync, ruff check, ruff format --check, pyright, the Alembic head and drift checks
  # (`alembic check` against `fundlens.app_schema`, spec §7.3), pytest. Scope and options live in
  # pyproject.toml; settings and MinIO come from .github/ci/env and .github/ci/setup.sh.
  python:
    uses: neuroticsasquat-ch/workflows/.github/workflows/python.yml@v1
    with:
      postgres: "18"

  # pnpm install, then the package scripts lint, typecheck, test and build.
  js:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: neuroticsasquat-ch/workflows/.github/workflows/js.yml@v1
    with:
      working-directory: frontend

  # Coolify deploys docker-compose.prod.yml; a typo in it would otherwise surface only there.
  # Warnings about its unset secrets are expected.
  prod-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose -f docker-compose.prod.yml config --quiet

  # Spec §7.2: the SPA's client types are generated from the API's OpenAPI document, and both
  # are committed. Regenerating them here must change nothing, so a contract change that lands
  # without its regenerated client fails the build (ADR-0003). Not path-filtered: a backend-only
  # change is exactly the one that can leave the client stale.
  openapi-drift:
    runs-on: ubuntu-latest
    # The export builds the app from settings, which require these; nothing is reached.
    env:
      DATABASE_URL: postgresql://unused@localhost/unused
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: unused
      R2_SECRET_ACCESS_KEY: unused
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to the exact tag: setup-uv publishes no floating major tag.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-dev
      # pnpm comes from `packageManager` in frontend/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # What `task fe:generate` runs, outside the containers.
      - name: Regenerate openapi.json and frontend/src/api/
        run: |
          uv run --no-sync fundlens api --export-openapi > openapi.json
          sh frontend/scripts/generate-api.sh < openapi.json
      - name: OpenAPI drift check
        run: |
          # `status`, not `diff`: it also catches a generated file that is new and untracked.
          if [ -n "$(git status --porcelain -- openapi.json frontend/src/api/)" ]; then
            git status --short -- openapi.json frontend/src/api/
            git diff -- openapi.json frontend/src/api/
            echo "::error::openapi.json or frontend/src/api/ is stale: run \`task fe:generate\` and commit the result"
            exit 1
          fi

  # Builds the prod image (the Dockerfile's last stage) without pushing, checks it doesn't run
  # as root, and runs .github/ci/smoke.sh on it. Coolify builds and deploys it from main.
  image:
    uses: neuroticsasquat-ch/workflows/.github/workflows/image-check.yml@v1

  ci: # the one required check; the name is the contract
    if: always()
    # Every other job, extras included. `changes` is here too: if it fails, `js` is skipped, and
    # the gate passes a skip.
    needs: [changes, python, js, prod-check, openapi-drift, image]
    runs-on: ubuntu-latest
    steps:
      - uses: neuroticsasquat-ch/workflows/actions/gate@v1
        with:
          needs: ${{ toJSON(needs) }}
