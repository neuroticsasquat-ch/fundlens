# Employer, organization and payee aliases (v1 spec §6.2, spec §5.4): each canonical, written as
# it normalizes, over the spellings filers use for it. All three are keyed by organization_key, so
# an entry regroups an employer, an organization and a payee alike (ADR-0011, ADR-0012). A
# spelling is written as filers write it; it is normalized (resolve.normalize: uppercased,
# punctuation deleted, legal form stripped) before it is matched, so 'Tesla, Inc.' needs no entry
# beside 'TESLA'. A spelling under two canonicals fails the build.
# Only the top employers by contribution count and the split payees a payee review found are
# here: linkage handles the long tail of employers.

SPACEX:
  - Space Exploration Technologies
  - Space Exploration Technologies Corp.
  - Space X
TESLA:
  - Tesla Motors
AMAZON:
  - Amazon.com
  - Amazon.com Services
META:
  - Meta Platforms
  - Facebook
IBM:
  - International Business Machines
GOLDMAN SACHS:
  - Goldman Sachs Group
JPMORGAN CHASE:
  - JPMorgan
  - JP Morgan Chase
  - J.P. Morgan
  - J.P. Morgan Chase
WALMART:
  - Wal-Mart Stores
  - Walmart Stores
UPS:
  - United Parcel Service

# Split payees (spec §5.4): the canonical is the key with more payee dollars.
AX MEDIA:
  - AXMEDIA
TEAM DIRECT:
  - TEAMDIRECT
# Anne Lewis Strategies LLC, trading as MissionWired: the legal name joins the trade name too.
MISSIONWIRED:
