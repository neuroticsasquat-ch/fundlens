# Each giving committee's recipients in gold's committee_top_recipient (NEU-2057), by rank:
# [recipient_kind, recipient_id, amount]. A candidate row is the giver's 24Ks credited to the
# candidate (pairs netting below 0 left out, NEU-2204), so the candidate rows add up to its
# total_to_candidates. A committee row is the recipients' receipts from it, `oth`'s and the
# name-matched `indiv` rows (`name_matched` above), and its 24Ks credited to no candidate. A
# receipt mirroring one of the giver's 24Ks (same recipient and amount: every 18K of a 24K above)
# is the 24K's twin, and so is any receipt credited to a candidate the giver credited a 24K to,
# whatever its amount: both are in the candidate's row alone. BRICKLAYERS UNITED PAC's committee
# rows: the super PAC its 18K ($50,000), its name-matched gift ($15,000) and its 24K credited to no
# candidate ($750); the party's building account its 31K ($2,000). Not OKAFOR FOR MARYLAND's
# name-matched 18K ($1,000), which no 24K mirrors: BRICKLAYERS credited 24Ks to OKAFOR, so her row
# holds its gifts to her. Ranked by amount, then kind, then id.
