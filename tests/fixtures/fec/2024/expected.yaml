# What the pipeline must make of the 2024 fixture cycle (spec §12). Every number here is checked
# against the fixture CSVs by tests/unit/test_fec_fixture.py: change a row, then this file.
#
# Rules the totals follow (spec §4, ADR-0004):
# - A counted contribution is an `indiv` row with ENTITY_TP IND or CAN, or blank and a name the
#   classifier (resolve.normalize.is_organization_name, NEU-2132) does not call an organization's,
#   MEMO_CD not X, TRANSACTION_TP not 24T, not a conduit's own line for an earmark it passed on (a
#   15 whose MEMO_TEXT is 'EARMARKED FOR … (C########)'), not an intermediary's 24I its recipient
#   itemized too (OTHER_ID a committee in `cm`, no conduit and not the filer, holding a row of the
#   same name and amount, no memo line, refund, 24T or 24I, within 30 days; NEU-2203), and to a
#   committee in `cm`. Any other 24I is the filer's own receipt of an earmark, line 11(a)(i) money.
#   A refund (22Y, or any 2nY or 4nY type) is written positive and counted with its sign turned, so
#   it nets out. A gift to a conduit itself is counted, with no conduit.
# - Self-funding is a counted CAN row whose NAME is the cn name of the candidate its recipient
#   committee is linked to, and every counted 15C, 16C (a loan from the candidate) and 20C (its
#   repayment) whoever it names. It is never in total_individual: it is its own total.
# - A candidate's loan to their campaign, and its repayment, are counted contributions from `oth`
#   too (NEU-2071): a row typed 16C or 20C, MEMO_CD not X, to a committee in `cm`, mirroring no
#   `indiv` row of its type, committee, amount and date. A 20C subtracts its amount as filed. Its
#   candidate is its recipient's, never OTHER_ID's: WHITLOCK's repayment names his old House id.
# - A candidate's money is that of the committees `ccl` links to them as principal (P) or
#   authorized (A), and of the one their `cn` row names principal (CAND_PCC) whatever `ccl`'s
#   designation: STRATTON's, a leadership PAC since the election. Any other leadership PAC (D) is
#   not the candidate's. A committee handed from one candidate to another (fec/handoffs.csv) is the
#   first's before the handoff date and the second's on and after it, an undated row the second's:
#   C00703975, BIDEN's to 2024-07-21 and HARRIS's from then (NEU-2126). The same dated rule credits
#   its 24Ks, receipts and JFC attributions.
# - total_committee on a candidate, and total_to_candidates on the giver: `pas2` 24K rows not
#   filed by a conduit (a conduit's 24K is its side of an earmark, ADR-0004), credited
#   to the candidate the recipient committee (OTHER_ID) is linked to, else to the giver's CAND_ID
#   if a candidate of the cycle, else to none and in neither figure (givers' CAND_ID is often stale).
#   Summed per giver and candidate, a pair netting below 0 (a void or refund of an earlier cycle's
#   gift, NEU-2204) is in neither figure either, but in the giver's total_returned_by_candidates
#   (`returned_by_candidates` below); one netting 0 or more counts its corrections with its gifts.
#   ie_support is `pas2` 24E, ie_oppose 24A, ie_total both; 24C is no independent expenditure.
#   One naming a candidate a committee was handed from is the other's on and after the handoff
#   date, and undated (NEU-2277): BRICKLAYERS' spending for BIDEN from 2024-07-21 is HARRIS's.
#   total_from_committees: `oth` receipts from committees, by the receiving committee (CMTE_ID):
#   TRANSACTION_TP 1x or 3x, MEMO_CD not X, from a giver: OTHER_ID when a committee's id, else, when
#   blank, the designation-J committee whose name NAME is, compared after uppercasing and dropping
#   all but letters and digits, else, for a row typed PAC, COM, CCM or PTY, the one committee in
#   `cm` whose name NAME is (NEU-2131); naming none, the row is no receipt. The same name rule
#   makes a counted `indiv` row typed PAC, COM, CCM or PTY, or blank and classified (NEU-2132),
#   with a blank OTHER_ID a receipt from the one committee its NAME names, dropped when it names
#   none or its own recipient (a classified row is an organization receipt then), or when `oth`
#   already holds the gift under that committee's id (same recipient, amount and date). So does
#   a counted `indiv` row typed ORG with no committee id (OTHER_ID blank or not C-prefixed) whose
#   NAME names one committee of a political type, any but I, C and E (NEU-2195). A
#   committee's gift to a candidate is in both files (the giver's 24K, the recipient's 18K): no
#   figure adds the two.
# - An organization receipt (NEU-2131, ADR-0011) is an `indiv` row typed ORG and no committee's
#   gift by the name rule above (NEU-2195), or blank and classified and naming no one committee
#   (NEU-2132, `classified`), that would otherwise
#   count (MEMO_CD not X, not 24T, not a conduit's side, to a committee in `cm`), its refunds
#   subtracted as a contribution's are, or an `oth` receipt (1x or 3x, MEMO_CD not X) typed ORG
#   with no committee id in OTHER_ID (blank or not C-prefixed), naming no JFC, not a 15J nor a loan
#   (16C, 16F, 16G), and mirroring no counted `indiv` row (same recipient, name, amount and date).
#   Grouped by organization key, normalize_employer over the name. Organization money, in no total
#   here: NEU-2133's gold reads it. One whose type FEC files off line 11(a)(i), as below, is in
#   the committee's total_other_lines, not its total_from_organizations (NEU-2205).
# - A hybrid PAC (CMTE_TP V or W) keeps a non-contribution account, outside the contribution limits,
#   whose receipts `indiv` types 10 (10J a JFC's share, 24I an earmark through a conduit): kept, as
#   contributions or organization receipts, but in neither total_individual nor
#   total_from_organizations (NEU-2192). So is a refund there to a giver of such a 10, by NAME. A 10
#   to any other committee, a super PAC's, is an ordinary contribution.
# - A counted row whose type FEC files on a line other than 11(a)(i) (NEU-2193): a national
#   party's convention, headquarters or recount account (30, 31, 32 and variants, refunded as 40Y,
#   41Y, 42Y), a loan (16x), a transfer or other receipt (18G, 18J, 18K, 18L, 18U, 18H) or a Form
#   9 donation (19, 19J). Kept, the donor's, but in no
#   total_individual, the committee's, the candidate's or the race's: the committee's
#   total_other_lines (`other_lines` below). A candidate's own money is self-funding whatever its
#   type, and a 15C stays in total_individual.
# - total_jfc_transfers on a candidate: the `oth` receipts above from a designation-J committee,
#   whatever their type, a joint fundraising committee's transfer of the candidate's share,
#   credited to the candidate the receiving committee is linked to. In neither total_individual
#   nor total_committee: OKAFOR VICTORY FUND's 18J, 18G and blank-OTHER_ID 15J to OKAFOR.
# - A candidate alias (`aliases` below, NEU-2127) is in no race and holds no money: a 24K whose
#   giver wrote one's id, its recipient linked to no candidate, is credited to the id it is an
#   alias of.
# - A race's totals are the sums over the candidates attached to it.
# All amounts are whole dollars.

cycle: 2024

# Data rows per bulk file, comment lines and header excluded.
rows:
  cm: 23
  cn: 15
  ccl: 15
  indiv: 378
  pas2: 28
  oth: 31

# Rows per silver table after transform. independent_expenditure is every `pas2` row but the
# 24K committee contributions (24A/24E, and the 24C kept with its kind). committee_transfer is
# every `oth` receipt from a committee (recorded by the receiving committee), every `indiv` row a
# committee's by the name rule (`name_matched` below), plus every `pas2` 24K row not filed by a
# conduit (a disbursement, recorded by the giver): the one gift on both sides, each side its own
# row. organization_receipt is one row per `organization_receipts` receipt below.
silver:
  committee: 23
  candidate: 15
  candidate_committee_link: 15
  contribution: 324
  independent_expenditure: 13
  committee_transfer: 32
  organization_receipt: 15
  # One row per `attributions` line below.
  jfc_attribution: 6
  # One row per contributor key among the counted contributions and the JFC attributions (spec
  # §6.1, §6.11): more than the donors below, since a key is a spelling and a donor may have
  # several; fewer than the contributions.
  contributor: 132

contributions:
  # Twelve earmark triples (two planted, ten ordinary): each drops its memo line and its 24T. And
  # seven memo lines on the super PAC's filing 1900215 that attribute a row or memo line it holds,
  # restate a gift or are no attribution (NEU-2198): SEVERN CAPITAL's three partners, MAGOTHY
  # HOLDINGS's two, MBEKI's restated gift and PELLEGRINO's in-kind stock.
  dropped_memo: 19
  # Memo lines that are the only record of a gift (NEU-2198): THORVALDSEN's and IKEDA's shares of
  # PATAPSCO RIVER VENTURES's gift, ROSENKRANTZ's trust attribution (contributions) and MAGOTHY
  # HOLDINGS LLC's own line (an organization receipt).
  orphaned_attribution: 4
  dropped_conduit_24t: 12
  # BRICKLAYERS UNITED PAC's 24I passing LACROIX's gift on to OKAFOR, who itemized it too.
  dropped_intermediary_24i: 1
  # ActBlue's own line for an earmark, filed as a 15 rather than a 24T.
  dropped_conduit_side: 1
  # A conduit's refunds of earmarks (NEU-2199): WinRed's to FAIRBANKS, UMA and ActBlue's $50 to
  # PARK. ActBlue's refund of her $5 tip counts.
  dropped_conduit_refund: 2
  # The rows of a filing a later amendment supersedes (NEU-2196): the super PAC's Q2 filing,
  # CARVALHO's gift and TIDEWATER MARINE SUPPLY's, both restated by its 30S amendment.
  dropped_superseded: 2
  # A gift to a committee missing from `cm`.
  dropped_unknown_recipient: 1
  # Rows that are no individual's, by type or by the classifier: organizations' (ORG, or blank and
  # classified) and committees' (PAC), each counted elsewhere or dropped (`organization_receipts`,
  # `name_matched`).
  dropped_not_individual: 19
  self_funding: 5
  # Counted contributions with conduit_committee_id, by conduit. One WinRed earmark names its
  # conduit only in MEMO_TEXT. Three of ActBlue's are filed 24I by their recipients.
  earmarked:
    C00401224: 8
    C00694323: 7
  # Every counted contribution, self-funding included.
  total_amount: 2603775

# Organization receipts (NEU-2131, ADR-0011): the ORG rows of either file, and the classified
# blank-type `indiv` rows (NEU-2132), by the rule above, each the receiving committee's and no
# candidate's or donor's.
organization_receipts:
  # Every receipt's SUB_ID, with its organization key: two spellings of CHESAPEAKE STEEL and its
  # refund share one key.
  keys:
    4240100000000000025: ACME CONCRETE
    4240100000000000327: ACME WIDGETS # filed with no entity type, classified
    4240100000000000321: CHESAPEAKE STEEL
    4240100000000000322: CHESAPEAKE STEEL
    4240100000000000323: CHESAPEAKE STEEL
    4240300000000000026: IRONWORKERS LOCAL 16 # the union's 31K to the party's building account, in oth
    4240100000000000332: PATAPSCO HOLDINGS # the hybrid PAC's non-contribution account (NEU-2192)
    4240100000000000346: PISCATAWAY CONOY TRIBE # a 31T to the party's headquarters account (NEU-2205)
    4240100000000000347: BALTIMORE HARBOR PILOTS # a 15 to the party, line 11(a)(i)
    4240300000000000028: CHESAPEAKE ELECTION LAW GROUP # a 32J to the party's recount account, in oth
    4240100000000000356: ONE NATION # names a type I filer, no political committee (NEU-2195)
    4240100000000000360: TIDEWATER MARINE SUPPLY # the 30S amendment's; the Q2 filing's is superseded (NEU-2196)
    4240100000000000368: SEVERN CAPITAL # its partners' memo lines attribute it (NEU-2198)
    4240100000000000375: MAGOTHY HOLDINGS # a memo line, the only record of its gift (NEU-2198)
    4240100000000000378: SEVERN STATE LEADERSHIP FUND # a 10 its TRAN_ID puts on line 11(c) (NEU-2276)
  # Net amount by organization key, refunds subtracted.
  by_key:
    ACME CONCRETE: 5000
    ACME WIDGETS: 3000
    BALTIMORE HARBOR PILOTS: 5000
    CHESAPEAKE ELECTION LAW GROUP: 20000
    CHESAPEAKE STEEL: 72500
    IRONWORKERS LOCAL 16: 4000
    MAGOTHY HOLDINGS: 3000
    ONE NATION: 40000
    PATAPSCO HOLDINGS: 250000
    PISCATAWAY CONOY TRIBE: 15000
    SEVERN CAPITAL: 2000
    SEVERN STATE LEADERSHIP FUND: 20000
    TIDEWATER MARINE SUPPLY: 5000
  # Net amount by receiving committee.
  by_committee:
    C00800105: 8000
    C00800201: 142500
    C00800203: 44000
    C00800204: 250000
  total_amount: 444500
  # Each receiving committee's organizations (NEU-2133), by rank: the organization key, its
  # spelling with the most money (CHESAPEAKE STEEL's $47,500 against $25,000), the net amount.
  # Ranked by amount, then key; an organization netting to $0 or less is on no list.
  top_by_committee:
    C00800105:
      - [ACME CONCRETE, ACME CONCRETE LLC, 5000]
      - [ACME WIDGETS, ACME WIDGETS INC, 3000]
    C00800201:
      - [CHESAPEAKE STEEL, "CHESAPEAKE STEEL, INC.", 72500]
      - [ONE NATION, ONE NATION, 40000]
      - [SEVERN STATE LEADERSHIP FUND, SEVERN STATE LEADERSHIP FUND, 20000]
      - [TIDEWATER MARINE SUPPLY, TIDEWATER MARINE SUPPLY LLC, 5000]
      - [MAGOTHY HOLDINGS, MAGOTHY HOLDINGS LLC, 3000]
      - [SEVERN CAPITAL, SEVERN CAPITAL LLC, 2000]
    C00800203:
      - [CHESAPEAKE ELECTION LAW GROUP, CHESAPEAKE ELECTION LAW GROUP, 20000]
      - [PISCATAWAY CONOY TRIBE, PISCATAWAY CONOY TRIBE, 15000]
      - [BALTIMORE HARBOR PILOTS, BALTIMORE HARBOR PILOTS LLC, 5000]
      - [IRONWORKERS LOCAL 16, IRONWORKERS LOCAL 16, 4000]
    C00800204:
      - [PATAPSCO HOLDINGS, PATAPSCO HOLDINGS LLC, 250000]
  # The receipts filed with no entity type, which the classifier put here (NEU-2132).
  classified: [4240100000000000327]

# A hybrid PAC's non-contribution account (NEU-2192): the counted `indiv` rows and organization
# receipts typed 10 or 10J to a committee typed V or W, or 24I there with a memo naming the
# account (NEU-2203, NEU-2207), and the 20Y refunds there, by SUB_ID, each kept in its table and
# marked (the 20Y to HAYWARD, not the 22Y to TREVELYAN, nor his 24I with no such memo).
# by_committee is their net amount, individuals' and organizations' alike: gold's
# total_non_contribution_account, in neither total_individual (`committees` below holds the
# contribution account alone) nor total_from_organizations, which is `organization_receipts`'
# by_committee less organizations_by_committee here and in `other_lines`.
non_contribution_account:
