  organization_receipts: [4240100000000000332]
  by_committee:
    C00800204: 271000
  organizations_by_committee:
    C00800204: 250000

# Money on a line no total_individual counts (NEU-2193), by SUB_ID: GALLAGHER's gift to the party's
