  pas2: 16
  oth: 15

# Rows per silver table after transform. independent_expenditure is every `pas2` row but the
# 24K committee contributions (24A/24E, and the 24C kept with its kind). committee_transfer is
# every `oth` receipt from a committee (recorded by the receiving committee) plus every `pas2` 24K
# row (a disbursement, recorded by the giver): the one gift on both sides, each side its own row.
