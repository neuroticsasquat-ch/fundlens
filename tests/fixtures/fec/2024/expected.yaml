    - 4240100000000000020
    - 4240100000000000305
    - 4240100000000000307
    - 4240100000000000308
    - 4240100000000000336
    - 4240100000000000379
    - 4240100000000000383
    - 4240100000000000349
    - 4240100000000000352
    - 4240100000000000353
    - 4240100000000000354
  organization_receipts: [4240100000000000323, 4240100000000000381]
  by_committee:
    C00800106: -1000
    C00800107: -500
    C00800201: -3400
    C00800204: -2250
    C00401224: -5

# The `indiv` rows typed PAC, COM, CCM or PTY with a blank OTHER_ID (NEU-2131), and the classified
# blank-type ones naming one committee (NEU-2132) and the ORG ones with no committee id naming one
# political committee (NEU-2195: RESTORATION PAC, a super PAC; not ONE NATION, a type I filer, an
# organization receipt), by SUB_ID: the committee each is a
# committee_transfer receipt from, by the name rule above, or null when it is dropped (CHESAPEAKE
# LABOR COUNCIL PAC names no committee; MARYLAND FORWARD PAC names its own recipient). BRICKLAYERS
# UNITED PAC's is in the super PAC's total_from_committees, and the blank-type OLD LINE REPUBLICAN
# COMMITTEE's in DRISCOLL FOR CONGRESS's. The same rule
# makes `oth`'s blank-OTHER_ID 18K from BRICKLAYERS UNITED PAC to OKAFOR (4240300000000000022) a
# receipt, in OKAFOR FOR MARYLAND's total_from_committees.
name_matched:
  4240100000000000324: C00800202
  4240100000000000325: null
  4240100000000000326: null
  4240100000000000329: C00800203
  4240100000000000355: C00800205

# Each giving committee's recipients in gold's committee_top_recipient (NEU-2057), by rank:
# [recipient_kind, recipient_id, amount]. A candidate row is the giver's 24Ks credited to the
# candidate (pairs netting below 0 left out, NEU-2204), so the candidate rows add up to its
# total_to_candidates. A committee row is the recipients' receipts from it, `oth`'s and the
# name-matched `indiv` rows (`name_matched` above), and its 24Ks credited to no candidate. A
# receipt mirroring one of the giver's 24Ks (same recipient and amount: every 18K of a 24K above)
# is the 24K's twin, and so is any receipt credited to a candidate the giver credited a 24K to,
# whatever its amount: both are in the candidate's row alone. BRICKLAYERS UNITED PAC's committee
# rows: the super PAC its 18K ($50,000), its name-matched gift ($15,000) and its 24K credited to no
# candidate ($750); the party's building account its 31K ($2,000). Not OKAFOR FOR MARYLAND's
# name-matched 18K ($1,000), which no 24K mirrors: BRICKLAYERS credited 24Ks to OKAFOR, so her row
# holds its gifts to her. Ranked by amount, then kind, then id.
top_recipients:
  C00800202:
    - [committee, C00800201, 65750]
    - [candidate, H4MD05106, 5000]
    - [candidate, P40000101, 5000]
    - [candidate, S4MD00103, 5000]
    - [candidate, H4MD05107, 2500]
    - [candidate, P80000722, 2500]
    - [candidate, H4MD05108, 2000]
    - [committee, C00800203, 2000]
    - [candidate, S4MD00104, 1000]
  C00800203:
    - [candidate, S4MD00104, 5000]
    - [committee, C00800107, 2000]
    - [candidate, H4MD09109, 1000]
  C00800114:
    - [candidate, H4MD05106, 5000]
  C00800113:
    - [committee, C00800103, 20000]
  C00800102:
    - [committee, C00800203, 15000]
  C00800115:
    - [committee, C00800103, 19500]
  C00800205:
