# What `fundlens validate --cycle 2024 --top 3` must report on the fixture after `resolve --full`
# with the fixture overrides and adjudications (spec §6.8, §6.9, NEU-2054 §8.1). Pairs follow from `donors` above: a donor
# with k contributor keys among its counted contributions contributes k(k-1)/2 true pairs.
validation:
  dime_version: "4.0"
  # Every counted `indiv` contribution with a date: the fixture labels them all, but the DIME
  # import drops a label with no date and the validator matches on it, so VOSS's undated gift is
  # never matched. DIME labels no `oth` row, so WHITLOCK's loan and repayment there (NEU-2071) are
  # unmatched too; their contributor key is his labelled one.
  matched_rows: 321
  # Contributor keys with a dated counted contribution: 132 less the 15J-only key and VOSS's.
  labelled_keys: 130
  overall: {precision: 1.0, recall: 1.0}
  top: {limit: 3, precision: 1.0, recall: 1.0}
