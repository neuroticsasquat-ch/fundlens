# What the pipeline must make of the 2024 fixture cycle (spec §12). Every number here is checked
# against the fixture CSVs by tests/unit/test_fec_fixture.py: change a row, then this file.
#
# Rules the totals follow (spec §4, ADR-0004):
# - A counted contribution is an `indiv` row with ENTITY_TP IND or CAN, MEMO_CD not X,
#   TRANSACTION_TP not 24T, not a conduit's own line for an earmark it passed on (a 15 whose
#   MEMO_TEXT is 'EARMARKED FOR … (C########)'), and to a committee in `cm`. Refunds (negative 22Y
#   rows) are counted and net out. A gift to a conduit itself is counted, with no conduit.
# - Self-funding is a counted CAN row whose NAME is the cn name of the candidate its recipient
#   committee is linked to. It is never in total_individual: it is its own total.
# - A candidate's money is that of the committees `ccl` links to them as principal (P) or
#   authorized (A). A leadership PAC (D) is not the candidate's.
# - total_committee on a candidate, and total_to_candidates on the giver: `pas2` 24K rows.
#   ie_support is `pas2` 24E, ie_oppose 24A, ie_total both; 24C is no independent expenditure.
#   total_from_committees: `oth` receipts from committees, by the receiving committee (CMTE_ID):
#   TRANSACTION_TP 1x or 3x, MEMO_CD not X, OTHER_ID a committee's id. A committee's gift to a
#   candidate is in both files (the giver's 24K, the recipient's 18K): no figure adds the two.
# - A race's totals are the sums over the candidates attached to it.
# All amounts are whole dollars.

cycle: 2024

