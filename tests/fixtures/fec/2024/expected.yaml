  # ActBlue's own line for an earmark, filed as a 15 rather than a 24T.
  dropped_conduit_side: 1
  # A gift to a committee missing from `cm`.
  dropped_unknown_recipient: 1
  dropped_not_individual: 1
  self_funding: 3
  # Counted contributions with conduit_committee_id, by conduit. One WinRed earmark names its
  # conduit only in MEMO_TEXT.
  earmarked:
    C00401224: 5
    C00694323: 7
  # Every counted contribution, self-funding included.
  total_amount: 2244780

