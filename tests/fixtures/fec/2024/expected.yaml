# The donors behind the planted hard cases (spec §6), each with every one of their counted
# contributions by SUB_ID and their label in tests/fixtures/dime/ (`bonica.cid`).
# resolved_by: `linkage` when Splink should group their contributor keys, `merge_override` /
# `split_override` when it takes an entry in resolution/overrides.yaml, `none` when all their
# contributions share one contributor key and there is nothing to group.
